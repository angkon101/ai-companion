<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Online Pet Cat</title>
  <meta name="description" content="A simple, lifelike AI Online Pet Cat. Roams around, cleans itself, and playfully swats at your cursor with its paws!">
  <link rel="stylesheet" href="/src/style.css">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🐾</text></svg>">
</head>
<body>

  <!-- Native Desktop App Title Bar (Electron only) -->
  <div id="desktop-titlebar" class="desktop-titlebar">
    <div class="titlebar-drag-region">
      <span class="titlebar-icon">🐾</span>
      <span class="titlebar-title">PET CAT // DESKTOP BUDDY</span>
    </div>
    <div class="titlebar-controls">
      <button id="btn-win-pin" class="win-btn active" title="Toggle Always-on-Top Pin" aria-label="Pin Always on Top">📌</button>
      <button id="btn-win-min" class="win-btn" title="Minimize" aria-label="Minimize Window">🗕</button>
      <button id="btn-win-close" class="win-btn win-btn-close" title="Close" aria-label="Close Window">✕</button>
    </div>
  </div>

  <div id="app">
    <!-- Clean Minimalist Header -->
    <header class="app-header">
      <div class="brand-info">
        <span class="brand-emoji">🐾</span>
        <span class="brand-title">Cat Pet</span>
      </div>

      <!-- Quick Breed Selector -->
      <div class="breed-pills">
        <button class="breed-pill active" data-breed="calico" title="Calico (Anatomical Feline)">Calico</button>
        <button class="breed-pill" data-breed="tabby" title="Orange Tabby">Tabby</button>
        <button class="breed-pill" data-breed="void" title="Midnight Void">Black</button>
        <button class="breed-pill" data-breed="siamese" title="Siamese">Siamese</button>
      </div>
      
      <div class="header-actions">
        <!-- Audio Mute Toggle -->
        <button id="btn-sound-toggle" class="icon-btn active" title="Toggle Purrs & Meows" aria-label="Toggle Sound Effects">
          🔊
        </button>
        <!-- Picture-in-Picture / Float Over IDE -->
        <button id="btn-pip-toggle" class="pip-float-btn" title="Float over Antigravity IDE (Picture-in-Picture)">
          <span>🪟</span> Float
        </button>
      </div>
    </header>

    <!-- Main Pet Terrarium / Living Room -->
    <div id="companion-dock-slot">
      <main id="pet-room-card" class="pet-room-card">
        
        <!-- Hint label -->
        <div class="pet-hint-bar">
          <span class="hint-text">Move cursor near the cat to play! Click to pet.</span>
        </div>

        <!-- Roaming Floor Stage -->
        <div id="pet-stage" class="pet-stage">
          <!-- The Autonomous Living Cat -->
          <div id="pet-cat-actor" class="pet-cat-actor" title="Click to pet me!">
            <!-- Injected via PetBrain / renderPetCat -->
          </div>
        </div>

        <!-- Subtle Activity Bar -->
        <footer class="pet-actions-bar">
          <button id="btn-pet-groom" class="pet-action-chip" title="Watch cat clean itself">
            <span>👅</span> Clean Paw
          </button>
          <button id="btn-pet-roam" class="pet-action-chip" title="Tell cat to explore">
            <span>🐾</span> Roam Around
          </button>
          <button id="btn-pet-treat" class="pet-action-chip" title="Feed a fish treat">
            <span>🐟</span> Treat
          </button>
        </footer>

      </main>
    </div>
  </div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
